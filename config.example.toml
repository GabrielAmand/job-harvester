[[sources]]
type = "greenhouse"
company = "Example Company"
board_token = "examplecompany"

[[sources]]
type = "lever"
company = "Example Lever Company"
company_slug = "examplelevercompany"

[[sources]]
type = "france_travail"
search_terms = [
  "DevOps",
  "Cloud",
  "Infrastructure",
  "Linux",
  "SRE",
  "Site Reliability",
  "Administrateur systèmes",
  "Ingénieur systèmes",
  "Ingénieur production",
  "Cloud Engineer",
  "Platform Engineer",
  "Automation",
  "CI/CD",
]

[filters]
positive_title_keywords = [
  "devops",
  "cloud",
  "platform",
  "infrastructure",
  "linux",
  "site reliability",
  "sre",
  "systems engineer",
  "production engineer",
  "automation",
  "ci/cd",
]
negative_title_keywords = [
  # Add profile-specific title exclusions here.
]
excluded_title_phrases = [
  "program manager",
  "product manager",
  "product management",
  "project manager",
  "engineering manager",
  "director",
  "head of",
  "vice president",
  "vp",
]
# Omit or leave empty to accept every location.
location_keywords = []
remote_policy = "any" # any, prefer, or require
allow_hybrid = true
allow_onsite = true
exclude_incompatible_remote = true
allow_strong_seniority = false

[career_ops]
enabled = false
# Absolute path to your local Career-Ops checkout.
repository_path = "/path/to/career-ops"
node_command = "node"
batch_size = 20
