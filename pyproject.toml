[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "job-harvester"
version = "0.10.1"
description = "Collect public job listings into a local SQLite database"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "google-api-python-client>=2.0,<3",
  "google-auth-oauthlib>=1.0,<2",
]

[project.scripts]
job-harvester = "job_harvester.cli:main"
